---
name: Deploy

# Issue #325: Live smoke tests as the deploy gate
# Issue #322: "merge to main" means "deployed to production".
# Issue #324: Alembic migration job in the deploy pipeline.
# Issue #327: production deployment executed and verified.
# Assumes the existing GitHub OIDC deployment role (no long-lived AWS creds).
# Pipeline: build api.zip + gateway.zip → deploy infrastructure stacks →
# run Alembic migration → deploy the Compute stack → sync secret-backed
# Lambda env vars from SSM → live smoke tests as final gate.
# GitHub environment `production` maps to CDK env `prod`.

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        required: true
        options:
          - dev
          - staging
          - production
      force:
        description: 'Force deployment even if smoke tests fail (emergency only)'
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  resolve:
    # GitHub does not allow the `env` context in a job's `environment` field,
    # and a push to main must map to prod — resolve the targets once here and
    # pass them to every later job through `needs` outputs (which ARE allowed
    # in `environment`).
    name: Resolve deployment target
    runs-on: ubuntu-latest
    outputs:
      cdk_env: ${{ steps.target.outputs.cdk_env }}
      deploy_env: ${{ steps.target.outputs.deploy_env }}
    steps:
      - name: Resolve environment mapping
        id: target
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
        run: |
          case "$INPUT_ENV" in
            production)
              echo "cdk_env=prod" >> "$GITHUB_OUTPUT"
              echo "deploy_env=production" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "cdk_env=staging" >> "$GITHUB_OUTPUT"
              echo "deploy_env=staging" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "cdk_env=dev" >> "$GITHUB_OUTPUT"
              echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # push to main = production deploy (issue #322)
              echo "cdk_env=prod" >> "$GITHUB_OUTPUT"
              echo "deploy_env=production" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build Lambda packages
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api_zip: ${{ steps.build.outputs.api_zip }}
      gateway_zip: ${{ steps.build.outputs.gateway_zip }}
      api_sha256: ${{ steps.build.outputs.api_sha256 }}
      gateway_sha256: ${{ steps.build.outputs.gateway_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Build Lambda packages
        id: build
        run: |
          uv run python scripts/build_lambda.py --output dist/lambda --package all
          echo "api_zip=dist/lambda/api.zip" >> $GITHUB_OUTPUT
          echo "gateway_zip=dist/lambda/gateway.zip" >> $GITHUB_OUTPUT
          echo "api_sha256=$(cat dist/lambda/api.zip.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "gateway_sha256=$(cat dist/lambda/gateway.zip.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-packages-${{ needs.resolve.outputs.cdk_env }}
          path: |
            dist/lambda/api.zip
            dist/lambda/api.zip.sha256
            dist/lambda/gateway.zip
            dist/lambda/gateway.zip.sha256
          retention-days: 7

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.deploy_env }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.deploy_env }}
    permissions:
      id-token: write
      contents: read
    outputs:
      custom_domain: ${{ steps.endpoints.outputs.custom_domain }}
      api_endpoint: ${{ steps.endpoints.outputs.api_endpoint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v8
        with:
          name: lambda-packages-${{ needs.resolve.outputs.cdk_env }}
          path: dist/lambda

      - name: Verify checksums
        run: |
          cd dist/lambda
          sha256sum -c api.zip.sha256
          sha256sum -c gateway.zip.sha256

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ needs.resolve.outputs.cdk_env }}-${{ github.run_id }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync CDK dependencies
        run: |
          cd infra/cdk
          uv sync --frozen --project .

      - name: Synthesize CDK stacks
        run: |
          cd infra/cdk
          CDK_OUTDIR=cdk.out JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION=1 \
            uv run --no-project --with-requirements requirements.txt \
            python -m app.app

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2.162.1

      - name: Install Python CDK dependencies globally
        run: |
          cd infra/cdk
          pip install -r requirements.txt

      - name: Deploy CDK infrastructure stacks
        env:
          CDK_ENV: ${{ needs.resolve.outputs.cdk_env }}
          LAMBDA_ZIP: ${{ github.workspace }}/dist/lambda/api.zip
          GATEWAY_ZIP: ${{ github.workspace }}/dist/lambda/gateway.zip
        run: |
          cd infra/cdk
          CDK_OUTDIR=cdk.out JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION=1 \
            cdk deploy \
            "FinSight-${CDK_ENV}-Network" \
            "FinSight-${CDK_ENV}-Data" \
            "FinSight-${CDK_ENV}-Messaging" \
            "FinSight-${CDK_ENV}-Auth" \
            "FinSight-${CDK_ENV}-StepFunctions" \
            "FinSight-${CDK_ENV}-Observability" \
            --require-approval never

      - name: Run database migration
        if: needs.resolve.outputs.cdk_env == 'prod'
        run: |
          uv sync --frozen --all-extras
          uv run python scripts/run_migration.py \
            --environment ${{ needs.resolve.outputs.cdk_env }} \
            --region ${{ env.AWS_REGION }}

      - name: Adopt drifted HTTP API routes (one-off prod remediation)
        if: needs.resolve.outputs.cdk_env == 'prod'
        run: |
          # A GET /health route was created on the prod HTTP API outside of
          # CloudFormation (it appears in no stack template and no stack event
          # history), so the ApiGateway stack fails to CREATE its own route
          # with a 409 "Route with key GET /health already exists" conflict.
          # Adopt the API by deleting the unmanaged route right before CDK
          # re-creates it as a stack-managed resource. After a successful
          # deploy the stack owns the route and this step is a no-op.
          # See docs/deployment.md (stack-state migration notes).
          STACK=FinSight-${{ needs.resolve.outputs.cdk_env }}-ApiGateway
          MANAGED=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK" \
            --query "StackResourceSummaries[?contains(LogicalResourceId, 'GEThealth')].LogicalResourceId" \
            --output text)
          if [ -n "$MANAGED" ] && [ "$MANAGED" != "None" ]; then
            echo "Stack already manages the /health route ($MANAGED); nothing to adopt."
            exit 0
          fi
          API_ID=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ApiGatewayV2::Api'].PhysicalResourceId" \
            --output text)
          ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" \
            --query "Items[?RouteKey=='GET /health'].RouteId" \
            --output text)
          if [ -n "$ROUTE_ID" ] && [ "$ROUTE_ID" != "None" ]; then
            echo "Deleting unmanaged GET /health route $ROUTE_ID on API $API_ID"
            aws apigatewayv2 delete-route --api-id "$API_ID" --route-id "$ROUTE_ID"
          else
            echo "No physical GET /health route found; nothing to adopt."
          fi

      - name: Deploy CDK Compute and API Gateway stacks
        env:
          CDK_ENV: ${{ needs.resolve.outputs.cdk_env }}
          # Absolute paths are required: cdk deploy re-runs the app from
          # infra/cdk (per cdk.json), so relative paths resolve there and
          # silently fall back to the raise-at-import placeholder code.
          LAMBDA_ZIP: ${{ github.workspace }}/dist/lambda/api.zip
          GATEWAY_ZIP: ${{ github.workspace }}/dist/lambda/gateway.zip
        run: |
          cd infra/cdk
          # The ApiGateway stack owns the HTTP API routes and their Lambda
          # invoke permissions and imports the Compute function ARN, so CDK
          # orders Compute before ApiGateway automatically.
          CDK_OUTDIR=cdk.out JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION=1 \
            cdk deploy \
            "FinSight-${CDK_ENV}-Compute" "FinSight-${CDK_ENV}-ApiGateway" \
            --require-approval never

      - name: Sync secret-backed Lambda environment (SSM)
        if: needs.resolve.outputs.cdk_env == 'prod'
        run: |
          # CDK resets the function env on every deploy; secret-backed values
          # (Neon URL, gateway master key) never flow through CDK, so they are
          # re-injected from SSM here. See scripts/sync_lambda_env.py.
          uv run python scripts/sync_lambda_env.py \
            --environment ${{ needs.resolve.outputs.cdk_env }} \
            --region ${{ env.AWS_REGION }}

      - name: Sync gateway provider API keys (SSM)
        if: needs.resolve.outputs.cdk_env == 'prod'
        run: |
          # The model gateway runs litellm, which reads provider API keys
          # from the process environment (GROQ_API_KEY, GEMINI_API_KEY, ...).
          # CDK never owns these secrets, so they are re-injected from SSM
          # here after every deploy. Missing parameters are skipped with a
          # warning so a subset of providers can be configured.
          uv run python scripts/sync_lambda_env.py \
            --target gateway \
            --environment ${{ needs.resolve.outputs.cdk_env }} \
            --region ${{ env.AWS_REGION }}

      - name: Capture API endpoints from CDK outputs
        if: success()
        id: endpoints
        run: |
          STACK=FinSight-${{ needs.resolve.outputs.cdk_env }}-ApiGateway
          read_domain() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query 'Stacks[0].Outputs[?OutputKey==`'"$1"'`].OutputValue' \
              --output text \
              --region ${{ env.AWS_REGION }}
          }
          DOMAIN=$(read_domain "CustomDomainName${{ needs.resolve.outputs.cdk_env }}")
          ENDPOINT=$(read_domain "HttpApiUrl${{ needs.resolve.outputs.cdk_env }}")
          if [ -z "$DOMAIN" ] || [ "$DOMAIN" = "None" ]; then
            echo "::error::Custom domain not found in stack outputs"
            exit 1
          fi
          echo "custom_domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "api_endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

  smoke-tests:
    name: Smoke Tests (Deploy Gate)
    needs: [resolve, build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.resolve.outputs.deploy_env }}
    permissions:
      id-token: write
      contents: read
    env:
      # secrets is not available in step `if`, so expose the static-token
      # switch at job level (empty unless the env secret is configured).
      SMOKE_TEST_STATIC_JWT: ${{ secrets.SMOKE_TEST_JWT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Resolve smoke test base URL
        run: |
          DOMAIN="${{ needs.deploy.outputs.custom_domain }}"
          ENDPOINT="${{ needs.deploy.outputs.api_endpoint }}"
          if curl -fsS --max-time 10 "https://$DOMAIN/health" >/dev/null 2>&1; then
            BASE_URL="https://$DOMAIN"
          else
            echo "::warning::Custom domain $DOMAIN unreachable; falling back to raw API endpoint"
            BASE_URL="$ENDPOINT"
          fi
          echo "SMOKE_TEST_BASE_URL=$BASE_URL" >> $GITHUB_ENV

      - name: Configure AWS credentials
        if: env.SMOKE_TEST_STATIC_JWT == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-smoke-${{ needs.resolve.outputs.cdk_env }}-${{ github.run_id }}

      - name: Obtain smoke-test JWT (admin auth flow)
        if: env.SMOKE_TEST_STATIC_JWT == ''
        env:
          USER_EMAIL: ${{ secrets.SMOKE_TEST_USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.SMOKE_TEST_USER_PASSWORD }}
        run: |
          # The API function's env carries the pool/client ids CDK wired from
          # the Auth stack (no separate stack outputs needed).
          read_env() {
            aws lambda get-function-configuration \
              --function-name finsight-${{ needs.resolve.outputs.cdk_env }}-api \
              --query "Environment.Variables.$1" \
              --output text \
              --region ${{ env.AWS_REGION }}
          }
          POOL=$(read_env COGNITO_USER_POOL_ID)
          CLIENT=$(read_env COGNITO_CLIENT_ID)
          if [ -z "$POOL" ] || [ "$POOL" = "None" ]; then
            echo "::error::COGNITO_USER_POOL_ID not found on the API function env"
            exit 1
          fi
          TOKEN=$(aws cognito-idp admin-initiate-auth \
            --user-pool-id "$POOL" \
            --client-id "$CLIENT" \
            --auth-flow ADMIN_USER_PASSWORD_AUTH \
            --auth-parameters "USERNAME=$USER_EMAIL,PASSWORD=$USER_PASSWORD" \
            --query 'AuthenticationResult.IdToken' \
            --output text \
            --region ${{ env.AWS_REGION }})
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::Failed to obtain smoke-test JWT from Cognito"
            exit 1
          fi
          echo "SMOKE_TEST_JWT_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Run smoke tests
        id: smoke
        env:
          SMOKE_TEST_TIMEOUT: 30
          SMOKE_TEST_RETRIES: 3
          SMOKE_TEST_RETRY_DELAY: 10
        run: |
          uv run python scripts/smoke_test.py

      - name: Fail if smoke tests failed (unless forced)
        if: failure() && github.event.inputs.force != 'true'
        run: |
          echo "::error::Smoke tests failed. Deploy is not considered successful."
          echo "The previous version is still serving. No automatic rollback is triggered."
          echo "To rollback manually: redeploy the previous published version or shift the alias."
          exit 1

      - name: Warn if smoke tests failed but forced
        if: failure() && github.event.inputs.force == 'true'
        run: |
          echo "::warning::Smoke tests failed but deployment was forced via 'force' input."
          echo "The deployment may be in a broken state. Manual verification required."
          exit 0

  notify:
    name: Notify
    needs: [resolve, build, deploy, smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.resolve.outputs.deploy_env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Custom Domain:** https://${{ needs.deploy.outputs.custom_domain }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ${{ needs.smoke-tests.result == 'failure'
            && github.event.inputs.force != 'true' }}; then
            echo "❌ **Deploy FAILED** - Smoke tests did not pass." \
              "The previous version is still serving." >> $GITHUB_STEP_SUMMARY
          elif ${{ needs.smoke-tests.result == 'failure'
            && github.event.inputs.force == 'true' }}; then
            echo "⚠️ **Deploy FORCED** - Smoke tests failed but deployment" \
              "was forced. Manual verification required." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Deploy SUCCESSFUL** - All smoke tests passed." >> $GITHUB_STEP_SUMMARY
          fi
