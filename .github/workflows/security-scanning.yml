name: Advanced Quality Gates

"on":
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  property-tests:
    name: Property-based tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'property')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run property-based tests
        run: uv run pytest tests/property tests/properties tests/property_based tests/hypothesis tests/unit/property tests/unit/properties -v --tb=short -m "property"

  mutation-testing:
    name: Mutation testing (domain/application)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run mutmut
        run: uv run mutmut run

      - name: Mutation results
        if: always()
        run: uv run mutmut results || true

  static-security-scanning:
    name: Static security scanning baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Scan source with bandit
        run: uv run bandit -r src/finsight -c pyproject.toml

      - name: Scan dependencies
        run: uv run --with pip-audit==2.10.1 pip-audit --local --skip-editable --progress-spinner off

      - name: Scan infrastructure and containers
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
