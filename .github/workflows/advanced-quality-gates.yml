---
name: Advanced Quality Gates

# Runs advanced quality checks including security tools
# Issue #80: advanced quality gates with security scanning

"on":  # quoted to avoid yamllint truthy rule on 'on' key
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run bandit
        run: uv run bandit -r src/finsight -c pyproject.toml -f json -o bandit-report.json || true

      - name: Upload bandit report as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  pip-audit:
    name: pip-audit (Dependency Vulnerability Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run pip-audit
        run: |
          uv run --with pip-audit==2.10.1 pip-audit \
            --local --skip-editable --progress-spinner off \
            --format json --output pip-audit-report.json || true

      - name: Upload pip-audit report as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 7

  trivy:
    name: Trivy (Container & FS Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

env:
  UV_VERSION: "0.13.0"
