name: OpenAPI Contract

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --all-extras
      - run: ENVIRONMENT=test uv run python scripts/check_openapi.py
