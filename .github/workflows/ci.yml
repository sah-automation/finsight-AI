name: CI Pipeline

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Pinned to the local uv that generated uv.lock (revision 5). Upgrade this
  # and commit the regenerated lockfile together; see CONTRIBUTING.md.
  UV_VERSION: "0.13.0"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run ruff (lint)
        run: uv run ruff check src tests --exit-non-zero-on-fix

      - name: Run ruff (format check)
        run: uv run ruff format --check src tests

      - name: Run mypy
        run: uv run mypy src --strict --show-error-codes

      - name: Run import-linter
        run: uv run lint-imports --verbose

      - name: Run vulture
        run: uv run vulture src/finsight --min-confidence=80

      - name: Run detect-secrets
        run: uv run pre-commit run detect-secrets --all-files

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check relative Markdown links
        run: uv run python scripts/check_links.py

  architecture-tests:
    name: Architecture Invariant Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run architecture tests
        run: uv run pytest tests/architecture -v --tb=short

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit -v --tb=short -m "unit"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run coverage gate
        run: make coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run contract tests
        run: uv run pytest tests/contract -v --tb=short -m "contract"

  switch-tests:
    name: Switch Path Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run switch tests
        run: uv run pytest tests/unit/switches -v --tb=short -m "switch"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Start local services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run integration tests
        run: uv run pytest tests/integration -v --tb=short -m "integration"
        env:
          ENVIRONMENT: test
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566

      - name: Stop local services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Start Postgres
        run: docker compose -f docker-compose.test.yml up -d --wait postgres

      - name: Apply migrations
        run: ENVIRONMENT=test uv run alembic upgrade head

      - name: Roll back and re-apply
        run: |
          ENVIRONMENT=test uv run alembic downgrade base
          ENVIRONMENT=test uv run alembic upgrade head

      - name: Stop Postgres
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  golden-tests:
    name: Golden Set Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run golden tests (pilot config)
        run: uv run pytest tests/golden -v --tb=short -m "golden"
        env:
          ENVIRONMENT: development

      - name: Run golden tests (standard config)
        run: uv run pytest tests/golden -v --tb=short -m "golden"
        env:
          ENVIRONMENT: staging

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run security tests
        run: uv run pytest tests/security -v --tb=short -m "security"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Audit installed dependencies
        run: uv run --with pip-audit==2.10.1 pip-audit --local --skip-editable --progress-spinner off

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck, architecture-tests, unit-tests, contract-tests, switch-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify package builds
        run: uv build --wheel

      - name: Build Lambda package
        run: make lambda-build

      - name: Build container image
        run: docker build -t finsight-ai:ci .

  infra-synth:
    name: Infra Synth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Synthesize CDK stacks
        run: make infra-synth

      - name: Run CDK smoke tests
        run: make infra-test

  summary:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint-and-typecheck
      - pre-commit
      - architecture-tests
      - unit-tests
      - coverage
      - contract-tests
      - switch-tests
      - integration-tests
      - migrations
      - golden-tests
      - security-tests
      - dependency-audit
      - dependency-review
      - build-check
      - infra-synth
    if: always()
    steps:
      - name: Check required jobs
        run: |
          for result in \
            "${{ needs.lint-and-typecheck.result }}" \
            "${{ needs.pre-commit.result }}" \
            "${{ needs.architecture-tests.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs.contract-tests.result }}" \
            "${{ needs.switch-tests.result }}" \
            "${{ needs.security-tests.result }}" \
            "${{ needs.dependency-audit.result }}" \
            "${{ needs.build-check.result }}" \
            "${{ needs.infra-synth.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "❌ A required job failed"
              exit 1
            fi
          done

      - name: Check conditional jobs
        run: |
          for result in \
            "${{ needs.integration-tests.result }}" \
            "${{ needs.migrations.result }}" \
            "${{ needs.golden-tests.result }}" \
            "${{ needs.dependency-review.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ A conditional job failed"
              exit 1
            fi
          done
          echo "✅ All required jobs passed"
