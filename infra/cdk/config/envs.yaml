dev:
  name: dev
  # Application ENVIRONMENT value the config loader validates (it accepts
  # development/test/staging/production and maps them to config/*.yaml).
  environment: development
  removal_policy: destroy
  key_mode: aws_managed
  vector_store: neon_pgvector
  alerts:
    # Billing guardrails, applied by scripts/apply_billing_guardrails.py.
    # The amounts live here so the threshold changes by config, not code.
    monthly_budget_usd: 5
    anomaly_threshold_usd: 5
    # PLACEHOLDER: the owner replaces this with the real alert mailbox.
    notification_email: test@gmail.com
  data:
    point_in_time_recovery: false
    aurora_backup_retention_days: 1
    aurora_deletion_protection: false
staging:
  name: staging
  environment: staging
  removal_policy: destroy
  key_mode: aws_managed
  vector_store: aurora_pgvector
  alerts:
    monthly_budget_usd: 5
    anomaly_threshold_usd: 5
    notification_email: test@gmail.com
  data:
    point_in_time_recovery: false
    aurora_backup_retention_days: 1
    aurora_deletion_protection: false
prod:
  name: prod
  environment: production
  removal_policy: retain
  key_mode: aws_managed
  vector_store: aurora_pgvector
  alerts:
    # Monthly AWS spend guardrail. The budget alarm is created against this
    # value; changing the threshold later is a config change, not a code change.
    monthly_budget_usd: 5
    anomaly_threshold_usd: 5
    # PLACEHOLDER: the owner replaces this with the real alert mailbox.
    notification_email: test@gmail.com
  data:
    point_in_time_recovery: true
    aurora_backup_retention_days: 35
    aurora_deletion_protection: true
