dev:
  name: dev
  # Application ENVIRONMENT value the config loader validates (it accepts
  # development/test/staging/production and maps them to config/*.yaml).
  environment: development
  removal_policy: destroy
  key_mode: aws_managed
  data:
    point_in_time_recovery: false
    aurora_backup_retention_days: 1
    aurora_deletion_protection: false
staging:
  name: staging
  environment: staging
  removal_policy: destroy
  key_mode: aws_managed
  data:
    point_in_time_recovery: false
    aurora_backup_retention_days: 1
    aurora_deletion_protection: false
prod:
  name: prod
  environment: production
  removal_policy: retain
  key_mode: aws_managed
  data:
    point_in_time_recovery: true
    aurora_backup_retention_days: 35
    aurora_deletion_protection: true
