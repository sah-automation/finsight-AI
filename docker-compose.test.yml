services:
  # LocalStack for AWS services (S3, SQS, DynamoDB)
  localstack:
    image: localstack/localstack:3.5
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,dynamodb
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 10s
      retries: 10

  # PostgreSQL with pgvector for vector store
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis for caching (optional, used if needed)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Arize Phoenix for local trace viewing (SQLite mode, issue #280).
  # UI at http://localhost:6006; accepts OTLP HTTP on the same port. The
  # collector (not applications) exports into Phoenix so every span passes
  # the attributes/redact blocklist first.
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    ports:
      - "6006:6006"  # Phoenix UI + OTLP HTTP
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      # Phoenix enables authentication automatically for non-loopback
      # requests; the collector reaches it over the compose network, so auth
      # stays explicitly off for this local-only stack.
      - PHOENIX_ENABLE_AUTH=false
    volumes:
      - phoenix-data:/mnt/data
    healthcheck:
      # The image is distroless (no shell, no wget/curl); probe with python3.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # OTel Collector for traces
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Prometheus metrics
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      phoenix:
        condition: service_healthy

volumes:
  localstack-data:
  postgres-data:
  redis-data:
  phoenix-data:
