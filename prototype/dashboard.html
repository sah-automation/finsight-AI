<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | FinSight AI</title>
<link rel="stylesheet" href="styles.css">
<style>
.ctl{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.ctl select{height:32px;width:auto;appearance:auto;font-size:13px}
.chipc{display:inline-flex;align-items:center;height:32px;padding:0 var(--s3);border:1px solid var(--border-subtle);border-radius:var(--r-md);font-size:13px;color:var(--text-secondary);background:var(--bg-surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s3)}
.kpi{text-align:left;border:1px solid var(--border-subtle);border-radius:var(--r-lg);background:var(--bg-surface);padding:var(--s4);display:flex;flex-direction:column;gap:6px}
.kpi:hover{border-color:var(--border-strong);background:#fcfcfb}
.kl{font-weight:500;color:var(--text-secondary);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.kv{font:600 32px/36px var(--font);letter-spacing:-.01em}
.ku{font-size:12px;line-height:16px;color:var(--text-muted)}
.kd{display:flex;gap:var(--s2);align-items:center;font-size:12px;color:var(--text-muted)}
.ks{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.inf{border:1px solid var(--border-subtle);border-radius:var(--r-lg);background:var(--bg-surface);padding:var(--s5);display:flex;gap:var(--s3)}
.inf svg{color:var(--info);margin-top:2px}.inf h2{font:600 16px/24px var(--font)}.inf p{color:var(--text-secondary)}
h2.sec{font:600 18px/26px var(--font)}
.scrim{display:none;position:absolute;inset:0;background:rgba(24,24,27,.25);z-index:4}
.drawer{position:absolute;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--bg-surface);border-left:1px solid var(--border-subtle);box-shadow:var(--shadow-pop);z-index:5;transform:translateX(100%);transition:transform .18s ease-out;display:flex;flex-direction:column;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;gap:var(--s3);padding:var(--s5);border-bottom:1px solid var(--border-subtle)}.dh h2{font:600 18px/26px var(--font)}
.db{flex:1;overflow:auto;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s5)}.db h3{font:600 14px/20px var(--font);margin-bottom:var(--s2)}
.srcl{list-style:none;padding:0;border:1px solid var(--border-subtle);border-radius:var(--r-md)}.srcl li{display:flex;gap:var(--s2);align-items:center;padding:var(--s3);border-bottom:1px solid var(--border-subtle)}.srcl li:last-child{border-bottom:0}.srcl span{margin-left:auto;font-size:12px;color:var(--text-muted)}
.df{padding:var(--s4) var(--s5);border-top:1px solid var(--border-subtle)}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

.fcard .fig{border:0;border-radius:0}.fig td:first-child{font-weight:500}
.bts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s3)}
.bt{border:1px solid var(--border-subtle);border-radius:var(--r-lg);background:var(--bg-surface);padding:var(--s4);display:flex;flex-direction:column;gap:6px}
.bv{font:600 24px/30px var(--font);letter-spacing:-.01em}
.vlist{list-style:none;padding:0;margin:0}
.vr,.vax{display:grid;grid-template-columns:minmax(120px,200px) 1fr 104px;gap:var(--s3);align-items:center}
.vr{padding:10px 0;border-bottom:1px solid var(--border-subtle);position:relative}.vr:last-child{border-bottom:0}
.vl b{font-weight:500;display:block}.vl span{font-size:12px;line-height:16px;color:var(--text-muted)}
.vt{position:relative;height:22px}
.vt::before{content:"";position:absolute;left:50%;top:-10px;bottom:-10px;width:1px;background:var(--border-strong)}
.vb{position:absolute;top:2px;height:18px;border-radius:3px}
.vv{position:absolute;top:0;font:600 12px/22px var(--font);white-space:nowrap}
.vax{font-size:11px;line-height:16px;color:var(--text-muted);padding-bottom:6px;border-bottom:1px solid var(--border-subtle)}
.vax2{display:flex;justify-content:space-between}.vax em{font-style:normal}
@media(max-width:640px){.vr,.vax{grid-template-columns:1fr auto}.vr .vl{grid-column:1/-1}.vax .vax2{grid-column:1/-1}.vax span:first-child,.vax span:last-child{display:none}}
</style></head>
<!-- Accessibility: focus order - sidebar, filters, KPI cards, detail drawer; state selector is prototype-only. -->
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
<symbol id="dn" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="inf" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="sp" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></symbol>
<symbol id="ck" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
</defs></svg>
<div class="shell"><aside class="side" id="side" aria-label="Main"></aside>
<section class="mainc" id="main">
  <header class="pagebar"><div><h1>Dashboard</h1><p id="asof"></p></div>
    <div class="ctl"><label class="sr" for="per">Period</label><select class="input" id="per"><option value="7">Q3 2026</option><option value="6">Q2 2026</option><option value="5">Q1 2026</option></select>
      <span class="chipc">Currency: USD</span>
      <div class="seg2" role="group" aria-label="Time range"><button data-r="4" aria-pressed="true">4Q</button><button data-r="6" aria-pressed="false">6Q</button><button data-r="8" aria-pressed="false">8Q</button></div></div></header>
  <div class="pbody" id="body"></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Metric details"><div class="dh"><div style="flex:1"><h2 id="dn"></h2><div class="ku" id="dsub"></div></div><button class="ib" id="dc" aria-label="Close details"><svg class="i"><use href="#x"/></svg></button></div><div class="db" id="db"></div><div class="df"><a class="btn" id="dask" href="ask.html">Ask about this metric</a></div></aside>
</section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="shell.js"></script><script src="charts.js"></script>
<script>
FS.mount({current:'dashboard'});
const $=id=>document.getElementById(id);
if(!FS.can.dash){FS.deny($('main'))}else init();
function init(){
/* Prototype data. In the real app, values and changes come from the API and the UI never calculates them. */
const Q=['Q4 2024','Q1 2025','Q2 2025','Q3 2025','Q4 2025','Q1 2026','Q2 2026','Q3 2026'];
const S1=['Q3 Management Report','page 12, table 4'],S2=['Q3 Cost Breakdown','page 3, table 1'],S3=['Bank statement, September','page 2, table 1'];
const K=[
{id:'rev',l:'Revenue',u:'USD thousands',t:'usdk',up:1,stale:1,s:[S1],v:[3980.2,4025.6,4120.9,4215.4,4310.7,4402.3,4608.0,4820.5]},
{id:'gm',l:'Gross margin',u:'% of revenue',t:'pct',up:1,stale:1,s:[S1,S2],v:[38.9,39.4,39.1,39.6,39.8,40.6,41.2,37.8],how:'Calculated from revenue and cost of goods sold.'},
{id:'nm',l:'Net margin',u:'% of revenue',t:'pct',up:1,s:[S1],v:[8.1,8.6,8.4,9.0,9.2,9.8,10.1,7.3],how:'Calculated from net income and revenue.'},
{id:'opex',l:'Operating expenses',u:'USD thousands',t:'usdk',up:0,s:[S1],v:[820.4,835.0,842.7,850.3,861.9,870.2,884.6,912.8]},
{id:'cf',l:'Cash flow',u:'USD thousands, operating',t:'usdk',up:1,s:[S3],v:[310.5,298.2,325.9,340.1,352.7,361.4,388.0,244.6]},
{id:'burn',l:'Burn rate',u:'USD thousands per month',t:'usdk',up:0,s:[S3],v:[118.2,121.5,119.8,117.4,115.9,112.3,108.7,126.4],how:'Calculated from monthly net cash outflow.'},
{id:'run',l:'Runway',u:'months',t:'months',up:1,s:[S3],v:[27.5,27.1,27.8,28.8,29.5,30.9,32.8,25.2],how:'Calculated from cash balance and burn rate.'},
{id:'dso',l:'DSO',u:'days sales outstanding',t:'days',up:0,s:[S1],v:[41,40,42,41,40,39,38,44],how:'Calculated from receivables and revenue.'},
{id:'dpo',l:'DPO',u:'days payables outstanding',t:'days',up:1,s:[S1],v:[36,37,36,38,38,39,40,37],how:'Calculated from payables and cost of goods sold.'},
{id:'bva',l:'Budget vs actual',u:'% of budget, revenue',t:'pct',up:1,s:[S1],v:[98.2,99.1,100.4,99.8,101.2,100.6,102.1,96.9]}];
let idx=7,rng=4,st='normal';
$('pv').insertAdjacentHTML('beforeend','<label for="dst">State</label><select class="input" id="dst"><option value="normal">Normal</option><option value="loading">Loading</option><option value="empty">No data yet</option><option value="down">Unavailable</option></select>');
const SV={loading:()=>'<div class="status" aria-live="polite" style="color:var(--text-muted)">Loading figures</div><div class="kpis">'+Array(9).fill('<div style="height:150px;border-radius:12px;background:var(--bg-subtle)"></div>').join('')+'</div><div class="grid2"><div style="height:240px;border-radius:12px;background:var(--bg-subtle)"></div><div style="height:240px;border-radius:12px;background:var(--bg-subtle)"></div></div>',
 empty:()=>`<div class="inf" role="status">${ico('inf')}<div><h2>No figures yet</h2><p>Your KPIs appear here once financial statements have been processed.</p>${FS.can.upload?'<p style="margin-top:12px"><a class="btn btn-primary" href="upload.html">Upload a document</a></p>':'<p style="margin-top:8px">Ask your finance team to upload documents.</p>'}</div></div>`,
 down:()=>`<div class="notice warn" role="status" style="align-items:center"><svg class="i"><use href="#sp"/></svg><span>Temporarily unavailable. Please try again.</span><button class="btn sm" data-retry style="margin-left:auto">Try again</button></div>`};
const ico=n=>`<svg class="i"><use href="#${n}"/></svg>`,fmtv=k=>v=>k.t==='pct'?FC.num(v,1)+'%':k.t==='days'?FC.num(v,0):FC.num(v,1);
function delta(k,i){const a=k.v[i],b=k.v[i-1],d=a-b,sg=d<0?'−':'+',txt=k.t==='pct'?sg+FC.num(Math.abs(d),1)+' pts':sg+FC.num(Math.abs(d/b*100),1)+'%',good=(d>=0)===!!k.up;
 return `<span class="badge ${good?'ok':'bad'}">${ico(d<0?'dn':'up')}${txt}</span>`}
const sum=(n,l,v,t)=>`${n}: `+l.map((x,i)=>x+' '+FC.fmt(t,v[i])).join(', ')+'.';
function card(k){const i=idx,sp=k.v.slice(Math.max(0,i-5),i+1);
 return `<button class="kpi" data-k="${k.id}" aria-label="${k.l}, ${fmtv(k)(k.v[i])}, ${k.u}, ${Q[i]}. Open details."><div class="kl">${k.l}</div>${k.stale?'<span class="badge warn" style="align-self:flex-start">Updating, figures may change</span>':''}
 <div class="kv num">${fmtv(k)(k.v[i])}</div><div class="ku">${k.u}, ${Q[i]}</div>
 <div class="kd">${delta(k,i)}vs ${Q[i-1]}</div><div class="ks">${FC.spark(sp)}<span>${k.s.length} source${k.s.length>1?'s':''}</span></div></button>`}
function draw(){
 if(st!=='normal'){$('asof').textContent='Sample data.';$('body').innerHTML=SV[st]();return}
 const s=Math.max(0,idx-rng+1),lab=Q.slice(s,idx+1),R=K[0],G=K[1],rv=R.v.slice(s,idx+1),gv=G.v.slice(s,idx+1);
 $('asof').textContent=`As of ${Q[idx]}. Sample data, last updated 12 Oct 2026.`;
 let h=`<div class="notice warn" style="align-items:center"><svg class="i"><use href="#sp"/></svg><span>A document was updated. Figures marked Updating may change.</span></div>
 <div class="kpis">${K.map(card).join('')}</div>
 <h2 class="sec">Trends</h2><div class="grid2">
 ${FC.card({title:'Revenue',sub:'USD thousands',svg:FC.line({labels:lab,values:rv,t:'usdk',aria:sum('Line chart of revenue, USD thousands',lab,rv,'usdk')}),table:FC.table(['Quarter','Revenue'],lab.map((x,i)=>[x,FC.num(rv[i],1)]),[1]),cap:'Source: Q3 Management Report, page 12, table 4.'})}
 ${FC.card({title:'Gross margin',sub:'Percent of revenue',svg:FC.line({labels:lab,values:gv,t:'pct',aria:sum('Line chart of gross margin',lab,gv,'pct')}),table:FC.table(['Quarter','Gross margin'],lab.map((x,i)=>[x,FC.num(gv[i],1)+'%']),[1]),cap:'Source: Q3 Management Report, page 12, table 4.'})}</div>
 <h2 class="sec">Budget vs actual</h2>`;
 if(idx!==7)h+=`<div class="inf" role="status">${ico('inf')}<div><h2>I don’t have enough data for this period.</h2><p>Budget figures are only available for Q3 2026 in this sample. Choose Q3 2026 to see them.</p></div></div>`;
 else{
  const it=[['Freight and logistics',25.9,1,'806.0','640.0'],['Net income',-14.2,1,'351.9','410.0'],['Raw materials',6.5,1,'1,511.9','1,420.0'],['Revenue',-3.1,1,'4,820.5','4,975.0'],['Operating expenses',2.1,1,'912.8','894.0'],['Direct labour',-2.8,0,'680.3','700.0']].sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])),mx=25.9;
  const vt=r=>(r[1]<0?'−':'+')+FC.num(Math.abs(r[1]),1)+'%',rs=r=>r[2]?'Unfavorable':'Favorable',bd=r=>`<span class="badge ${r[2]?'bad':'ok'}">${rs(r)}</span>`;
  const rows=it.map(r=>{const w=(Math.abs(r[1])/mx*(FC.narrow()?32:40)).toFixed(1),ng=r[1]<0,c=r[2]?'var(--negative)':'var(--positive)';
   return `<li class="vr"><div class="vl"><b>${r[0]}</b><span>Actual ${r[3]} vs budget ${r[4]}</span></div><div class="vt" aria-hidden="true"><i class="vb" style="${ng?'right':'left'}:50%;width:${w}%;background:${c}"></i><b class="vv num" style="${ng?'right':'left'}:calc(50% + ${w}% + 8px)">${vt(r)}</b></div>${bd(r)}<span class="sr">${vt(r)} versus budget, ${rs(r).toLowerCase()}</span></li>`}).join('');
  const chart=`<div class="vax" aria-hidden="true"><span></span><span class="vax2"><em>Below budget</em><em>Above budget</em></span><span></span></div><ul class="vlist">${rows}</ul>`;
  const tiles=[['Revenue vs budget','−3.1%','4,820.5 vs 4,975.0'],['Net income vs budget','−14.2%','351.9 vs 410.0'],['Largest overrun','+25.9%','Freight and logistics']];
  h+=`<div class="bts">${tiles.map(t=>`<div class="bt"><div class="kl">${t[0]}</div><div class="bv num">${t[1]}</div><div class="kd"><span class="badge bad">Unfavorable</span>${t[2]}</div></div>`).join('')}</div>`;
  h+=FC.card({title:'Variance to budget',sub:'Q3 2026. Percent difference from budget, largest first. USD thousands in notes.',svg:chart,table:FC.table(['Item','Actual','Budget','Variance','Result'],it.map(r=>[r[0],r[3],r[4],vt(r),bd(r)]),[1,2,3]),cap:'Source: Q3 Management Report, page 14, table 6.'});
  const dr=[['Revenue','4,820.5','4,975.0','−154.5','−3.1%',1],['Cost of goods sold','2,998.2','2,845.0','+153.2','+5.4%',1],['Gross profit','1,822.3','2,130.0','−307.7','−14.4%',1],['Operating expenses','912.8','894.0','+18.8','+2.1%',1],['Operating income','909.5','1,236.0','−326.5','−26.4%',1],['Net income','351.9','410.0','−58.1','−14.2%',1]];
  h+=`<figure class="fcard"><div class="fh"><div><b>Detail</b><span>Actual vs budget, Q3 2026, USD thousands</span></div></div>`+FC.table(['Line item','Actual','Budget','Variance','Variance %','Result'],dr.map(r=>r.slice(0,5).concat([bd(r)])),[1,2,3,4])+`<figcaption>Source: Q3 Management Report, page 14, table 6.</figcaption></figure>`}
 $('body').innerHTML=h}
function open(id){const k=K.find(x=>x.id===id),s=Math.max(0,idx-rng+1),lab=Q.slice(s,idx+1),v=k.v.slice(s,idx+1);
 $('dn').textContent=k.l;$('dsub').textContent=k.u+', '+Q[idx];
 $('db').innerHTML=`<div><div class="kv num">${fmtv(k)(k.v[idx])}</div><div class="kd" style="margin-top:6px">${delta(k,idx)}vs ${Q[idx-1]}</div></div>
 ${k.stale?'<div class="notice warn"><svg class="i"><use href="#sp"/></svg><span>Updating, figures may change.</span></div>':''}
 <div class="fcard" style="border:0;padding:0">${FC.line({labels:lab,values:v,t:k.t,aria:sum('Line chart of '+k.l.toLowerCase(),lab,v,k.t)})}</div>
 ${FC.table(['Quarter',k.l],lab.map((x,i)=>[x,fmtv(k)(v[i])]),[1])}
 ${k.how?`<p class="ku">${k.how}</p>`:''}
 <div><h3>Sources</h3><ul class="srcl">${k.s.map(x=>`<li>${ico('doc')}${x[0]}<span>${x[1]}</span></li>`).join('')}</ul></div>`;
 $('dask').href='ask.html';$('drawer').classList.add('open');$('scrim').style.display='block';$('dc').focus()}
function close(){$('drawer').classList.remove('open');$('scrim').style.display='none'}
let tt;function flash(m){const t=$('toast');t.innerHTML=ico('ck')+'<span></span>';t.lastChild.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2500)}
$('per').onchange=()=>{idx=+$('per').value;draw()};
$('dst').onchange=()=>{st=$('dst').value;draw()};
$('body').addEventListener('click',e=>{if(e.target.closest('[data-retry]')){st='normal';$('dst').value='normal';draw()}});
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rng=+b.dataset.r;document.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
$('body').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)open(b.dataset.k)});
FC.bind($('body'),flash);$('dc').onclick=close;$('scrim').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape')close()});
draw();
}
</script></body></html>
