# Sample document manifest.
# Every file in this folder has one entry. Tests use this to find documents by
# type, company and feature instead of hard-coding file names.
#
# Generated by `uv run python scripts/fixture_builder`. Do not edit by hand.
#
# status is `final` or `draft`. A draft is kept for the audit trail only: answers
# must come from the latest final version of a document.
version: 1
documents:
  - path: pdf__company-a__2025-FY__annual-report.pdf
    file_type: pdf
    category: annual_report
    company: company-a
    period: FY2025
    status: final
    pages: 9
    features:
      - text
      - tables
      - multi_page
      - headings
    anonymized: true
    source: SEC XBRL companyfacts, CIK 0000320193, FY2023-FY2025 (2022-09-25..2025-09-27)
    notes: Born-digital Form 10-K. Income statement on page 4, balance sheet on page 5, cash flow on page 6.
  - path: pdf__company-a__2026-Q3__interim-report.pdf
    file_type: pdf
    category: interim_report
    company: company-a
    period: Q3 FY2026
    status: final
    pages: 6
    features:
      - text
      - tables
      - multi_page
      - headings
      - guidance
    anonymized: true
    source: SEC XBRL companyfacts, CIK 0000320193, Q3 FY2026 (2026-03-29..2026-06-27 and 2025-09-28..2026-06-27)
    notes: Born-digital Form 10-Q. Statements of operations on page 3, balance sheet on page 4, cash flow on page
      5, outlook on page 6.
  - path: pdf__company-a__2025-FY__annual-report-draft.pdf
    file_type: pdf
    category: draft
    company: company-a
    period: FY2025
    status: draft
    pages: 2
    features:
      - text
      - tables
      - superseded
      - multi_page
    anonymized: true
    source: SEC XBRL companyfacts, CIK 0000320193, FY2025 (2024-09-29..2025-09-27), preliminary values
    notes: Superseded draft with preliminary totals. Answers must come from the final annual report.
  - path: pdf__company-b__2026-FY__annual-report.pdf
    file_type: pdf
    category: annual_report
    company: company-b
    period: FY2026
    status: final
    pages: 7
    features:
      - text
      - tables
      - multi_page
      - headings
    anonymized: true
    source: SEC XBRL companyfacts, CIK 0001108524, FY2026 (2025-02-01..2026-01-31)
    notes: Second company, used for isolation and comparison questions. Income statement page 4, balance sheet page
      5, cash flow page 6.
  - path: scan__company-a__2026-Q3__bank-statement.pdf
    file_type: scan
    category: bank_statement
    company: company-a
    period: Q3 FY2026
    status: final
    pages: 2
    features:
      - ocr
      - image_only
      - slight_skew
      - speckle
      - low_confidence_page
    anonymized: true
    notes: Image-only PDF at 150 dpi. Page 2 is badly degraded so OCR confidence is low. No text layer on either
      page, so the reader must use OCR.
  - path: image__company-a__2025-FY__vendor-invoice.png
    file_type: image
    category: invoice
    company: company-a
    period: FY2025
    status: final
    pages: 1
    features:
      - ocr
      - image_only
      - table
    anonymized: true
    notes: Single-page PNG invoice. The reader must run OCR.
  - path: xlsx__company-a__2025-FY__budget-vs-actual.xlsx
    file_type: xlsx
    category: budget
    company: company-a
    period: FY2025
    status: final
    pages: 1
    features:
      - tables
      - two_sheets
      - units_in_header
    anonymized: true
    notes: Two sheets. Values are USD millions; variance (%) is stored as a percentage number.
  - path: csv__company-a__2025-FY__q4-ledger.csv
    file_type: csv
    category: ledger
    company: company-a
    period: Q4 FY2025
    status: final
    pages: 1
    features:
      - semicolon_delimiter
      - header_row
      - no_totals
    anonymized: true
    notes: Semicolon-delimited expense extract for 2025-06-29 to 2025-09-27. Amounts in USD, not millions.
  - path: docx__company-a__2025-FY__board-notes.docx
    file_type: docx
    category: board_notes
    company: company-a
    period: FY2025
    status: final
    pages: 2
    features:
      - paragraphs
      - bullets
      - numbered_list
      - tables
      - headers
    anonymized: true
    notes: Finance committee minutes. Two tables (decisions, actions). Page count is approximate because DOCX pagination
      is renderer-dependent.
  - path: csv__company-b__2026-FY__revenue-by-region.csv
    file_type: csv
    category: revenue_by_region
    company: company-b
    period: FY2026
    status: final
    pages: 1
    features:
      - comma_delimiter
      - header_row
      - total_row
    anonymized: true
    notes: Regional revenue in USD millions for FY2024 to FY2026. The total row matches the annual report.
