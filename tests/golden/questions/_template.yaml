# Shape of a single golden question. The real files are generated by
# `uv run python scripts/fixture_builder`; this one is a reference for reading
# the generated YAML and for reviewing a new question before it is coded.
version: 1

questions:
  - id: rev-001
    question: "What was total net revenue in FY2025?"
    category: financials
    difficulty: easy
    role: corporate_finance_planners
    company: company-a
    expected:
      answer: "Total net revenue in FY2025 was $416,161 million."
      numbers:
        - value: "416161"
          currency: "USD"
          unit: "million"
      citations:
        - document: pdf__company-a__2025-FY__annual-report.pdf
          page: 4
          table: "Consolidated statements of operations"
      insufficient_data: false
    tags: [revenue, single_document]
    notes: "The number comes from the generator's model, not from the answer model."

  - id: ins-001
    question: "What was marketing spend in 2022?"
    category: financials
    difficulty: easy
    role: corporate_finance_planners
    company: company-a
    expected:
      answer: null
      numbers: []
      citations: []
      insufficient_data: true
    tags: [out_of_range, no_guess]
    notes: "No 2022 documents exist; the system must say the data is insufficient."

  - id: acc-001
    question: "What was total net revenue in FY2025?"
    category: financials
    difficulty: easy
    role: system_admin
    company: company-a
    expected:
      answer: null
      numbers: []
      citations: []
      insufficient_data: false
      access_denied: true
    tags: [access, denied, system_admin]
    notes: "system_admin has configure-only rights on financials, never read."
