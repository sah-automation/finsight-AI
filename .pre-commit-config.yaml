# Pre-commit hooks for FinSight AI
# Run: pre-commit install && pre-commit run --all-files

repos:
  # General code quality
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--strict, --show-error-codes]
        additional_dependencies: [
            "pydantic>=2.10",
            "types-requests>=2.32",
            "types-PyYAML>=6.0",
            "python-json-logger>=2.0",
        ]
        types_or: [python, pyi]

  # Import architecture
  - repo: https://github.com/seddonym/import-linter
    rev: "1.12.1"
    hooks:
      - id: import-linter
        args: [--verbose]
        types: [python]

  # Dead code detection
  - repo: https://github.com/vulture/vulture
    rev: v2.10
    hooks:
      - id: vulture
        args: [--min-confidence=80, src/finsight]
        types: [python]
        exclude: ^tests/

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^tests/

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        types: [yaml]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        types: [shell]

  # Ensure no large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # Python specific
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: debug-statements
      - id: requirements-txt-fixer

# Architecture invariant tests (run in CI, not pre-commit)
# These are run via: make arch-test or pytest tests/architecture/

ci:
  autofix_commit_msg: "chore: pre-commit auto-fixes"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: pre-commit auto-update"
  autoupdate_schedule: weekly