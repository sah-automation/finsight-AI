# Pre-commit hooks for FinSight AI
# Run: make install-hooks && pre-commit run --all-files

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # General code quality
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Commit messages must follow Conventional Commits.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Type checking and import architecture run in the project environment
  # (via uv) so installed dependencies and the `finsight` package resolve,
  # matching `make typecheck` and `make imports`. An isolated hook env cannot
  # see the project's test/runtime dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run, src only)
        entry: uv run mypy src --strict --show-error-codes
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
      - id: import-linter
        name: import-linter (uv run)
        entry: uv run lint-imports --verbose
        language: system
        files: ^src/finsight/.*\.py$
        pass_filenames: false

  # Dead code detection
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        args: [--min-confidence=80, src/finsight]
        types: [python]
        exclude: ^tests/

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^tests/

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        types: [yaml]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        types: [shell]

  # Ensure no large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # Python specific
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: debug-statements
      - id: requirements-txt-fixer

# Architecture invariant tests (run in CI, not pre-commit)
# These are run via: make arch-test or pytest tests/architecture/

ci:
  autofix_commit_msg: "chore: pre-commit auto-fixes"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: pre-commit auto-update"
  autoupdate_schedule: weekly
