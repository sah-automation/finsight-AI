# Yamllint configuration for FinSight AI
extends: default

rules:
  line-length:
    max: 120
    level: warning
  comments-indentation:
    level: warning
  document-start:
    level: warning
  empty-lines:
    max: 2
    level: warning
  trailing-spaces:
    level: warning
  indentation:
    spaces: 2
    level: error
  key-duplicates:
    level: error
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    level: error
  comments:
    min-spaces-from-content: 1
    level: warning
