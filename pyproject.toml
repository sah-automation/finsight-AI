[project]
name = "finsight-ai"
version = "0.1.0"
description = "Financial Intelligence Platform"
readme = "README.md"
requires-python = "==3.12.*"
license = {text = "Apache-2.0"}
authors = [{name = "FinSight AI Team"}]
dependencies = [
    "fastapi>=0.115.0,<0.162",
    "uvicorn[standard]>=0.34.0,<0.55",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "pydantic-extra-types>=2.10.0,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.29.0,<1",
    "psycopg[binary,pool]>=3.2.0,<4",
    "pgvector>=0.5.0,<1",
    "alembic>=1.13.0,<2",
    "litellm>=1.58.0,<2",
    "cohere>=5.3.0,<8",
    "pdfplumber>=0.11.0,<1",
    "python-docx>=1.1.0,<2",
    "openpyxl>=3.1.0,<4",
    "pytesseract>=0.3.10,<1",
    "pdf2image>=1.17.0,<2",
    "Pillow>=10.0.0,<12",
    "boto3>=1.35.0,<2",
    "aiobotocore>=2.18.0,<4",
    "redis>=5.1.0,<9",
    "python-json-logger>=3.0.0,<5",
    "opentelemetry-api>=1.28.0,<2",
    "opentelemetry-sdk>=1.28.0,<2",
    "opentelemetry-exporter-otlp>=1.28.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
    "opentelemetry-instrumentation-httpx>=0.48b0,<1",
    "python-multipart>=0.0.18,<1",
    "email-validator>=2.2.0,<3",
    "pyyaml>=6.0.0,<7",
    "tenacity>=8.5.0,<10",
    "structlog>=25.1.0,<27",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=5.0.0,<8",
    "pytest-mock>=3.14.0,<4",
    "pytest-xdist>=3.6.0,<4",
    "pytest-timeout>=2.3.0,<3",
    "ruff>=0.7.0,<1",
    "mypy>=1.13.0,<3",
    "types-requests>=2.32.0,<3",
    "types-PyYAML>=6.0.0,<7",
    "import-linter>=1.0.0,<3",
    "vulture>=2.10.0,<3",
    "detect-secrets>=1.5.0,<2",
    "pre-commit>=4.0.0,<5",
    "freezegun>=1.5.0,<2",
    "faker>=34.0.0,<41",
    "reportlab>=4.2.0,<5",
    "hypothesis>=6.170.0,<7",
    "mutmut>=3.8.0,<4",
    "bandit>=1.9.0,<2",
]
[project.urls]
Homepage = "https://github.com/sah-automation/finsight-AI"
Repository = "https://github.com/sah-automation/finsight-AI"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TID", "TD", "ERA", "ANN", "ARG", "PTH", "PL", "TRY", "NPY", "PIE", "RUF", "S", "A", "Q", "DTZ", "TCH", "INT", "RET", "FLY", "PGH", "BLE", "PERF", "ICN", "LOG", "ISC"
]
ignore = [
    "ANN001",  # Missing type annotation for function argument - allowed in tests
    "ARG001",  # Unused argument - allowed for protocol compliance
    "ARG002",  # Unused argument - allowed for protocol compliance
    "B008",    # Do not perform function calls in argument defaults - intentional for config
    "PTH118",  # Use pathlib - allowed in tests
    "S101",    # Use of assert - allowed in tests
    "S105",    # Possible hardcoded password - allowed in test fixtures
    "S106",    # Possible hardcoded password - allowed in tests/fixtures
    "TID251",  # No TODOs - we track in GitHub issues
    "TRY003",  # Avoid specifying long messages outside the exception class - allowed
    "ERA001",  # Commented-out code - sometimes useful for debugging
    "PERF401", # List comprehension suggestion - not required
    "ANN401",  # Dynamic *args/**kwargs in compatibility shims
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S106", "PTH118", "ARG001", "ARG002", "E501", "E402", "PLR2004", "S311", "ANN401", "PLR0913", "PLR0917", "RET504"]
# The fixture builder is a data generator, not application code. Question text,
# answer prose and statement labels are written on one line so the generated
# YAML reads as prose. Each document writer lays out pages top to bottom and each
# question group is one block, so the statement and argument counts follow the
# content rather than a class design.
"scripts/fixture_builder/**/*" = ["E501", "PLR0913", "PLR0915", "PLR0917"]
"tests/golden/*" = ["BLE001", "PLC0415", "PLR0912", "PLR0915", "PLR2004", "E402", "SIM103", "SIM105", "S110", "RUF046"]
# CDK constructors are framework-shaped: they forward **kwargs to Stack and take
# one argument per dependency. Do not contort them to application lint limits.
"infra/cdk/**/*.py" = ["ANN003", "PLR0913", "PLR0917", "TC002"]
# Storage adapter exposes flexible constructor/input surfaces by design.
