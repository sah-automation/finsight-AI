[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
ignore_missing_imports = false
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-q",
    "--timeout=60",
]
markers = [
    "unit: Unit tests (fast, no network)",
    "integration: Integration tests (real services)",
    "golden: Golden set tests",
    "contract: Contract tests for ports",
    "architecture: Architecture invariant tests",
    "switch: Switch path tests",
    "security: Security tests (isolation, permissions, cache keys, evidence, PII)",
    "property: Property-based tests",
    "mutation: Mutation testing (scheduled/manual)",
    "performance: Performance and load tests",
    "load: Load tests",
    "perf: Performance tests",
    "benchmark: Performance benchmark tests",
    "placeholder: Intentionally pending test tracked until its feature lands (issue #74)",
]
[tool.coverage.run]
source = ["src/finsight"]
branch = true
omit = [
    "*/migrations/*",
    "*/conftest.py",
    "*/generated/*",
]
[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# Ratchet: raise this floor as the suite grows. See
# docs/plans/quality-standards-enforcement.md.
fail_under = 50
[tool.mutmut]
paths_to_mutate = ["src/finsight/domain", "src/finsight/application"]
tests_dir = ["tests/unit", "tests/contract", "tests/architecture"]
do_not_mutate = [
    "src/finsight/adapters",
    "src/finsight/entrypoints",
    "src/finsight/composition",
]
runner = "python -m pytest -x -q"
use_coverage = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", "infra"]
severity-level = "medium"
confidence-level = "medium"

[tool.coverage.html]
directory = "htmlcov"
[tool.importlinter]
root_package = "finsight"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain must not import outer layers"
type = "forbidden"
source_modules = ["finsight.domain"]
forbidden_modules = [
    "finsight.application",
    "finsight.adapters",
    "finsight.entrypoints",
    "finsight.composition",
]

[[tool.importlinter.contracts]]
name = "Application must not import adapters or entrypoints"
type = "forbidden"
source_modules = ["finsight.application"]
forbidden_modules = ["finsight.adapters", "finsight.entrypoints"]

[[tool.importlinter.contracts]]
name = "Entrypoints must not import adapters directly"
type = "forbidden"
source_modules = ["finsight.entrypoints"]
forbidden_modules = ["finsight.adapters"]

[[tool.importlinter.contracts]]
name = "Application must not import the composition root"
type = "forbidden"
source_modules = ["finsight.application"]
forbidden_modules = ["finsight.composition"]

[[tool.importlinter.contracts]]
name = "Adapters must not import outer layers"
type = "forbidden"
source_modules = ["finsight.adapters"]
forbidden_modules = [
    "finsight.application",
    "finsight.entrypoints",
    "finsight.composition",
]

[[tool.importlinter.contracts]]
name = "Core must not import outer layers"
type = "forbidden"
source_modules = ["finsight.core"]
forbidden_modules = [
    "finsight.domain",
    "finsight.application",
    "finsight.adapters",
    "finsight.entrypoints",
    "finsight.composition",
]

[[tool.importlinter.contracts]]
name = "Adapters must be independent"
type = "independence"
ignore_imports = [
    "finsight.adapters.audit.postgres_audit_log -> finsight.adapters.repositories.base_repository",
    "finsight.adapters.repositories.audit_log -> finsight.adapters.audit.postgres_audit_log",
    "finsight.adapters.repositories.audit_log_repository -> finsight.adapters.audit.postgres_audit_log",
    "finsight.adapters.repositories.postgres_audit_log -> finsight.adapters.audit.postgres_audit_log",
    "finsight.adapters.repositories.postgres_audit_log_repository -> finsight.adapters.audit.postgres_audit_log",
]
modules = [
    "finsight.adapters.llm",
    "finsight.adapters.embedding",
    "finsight.adapters.vector_store",
    "finsight.adapters.rerank",
    "finsight.adapters.readers",
    "finsight.adapters.repositories",
    "finsight.adapters.partitions",
    "finsight.adapters.storage",
    "finsight.adapters.queue",
