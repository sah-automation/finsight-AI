# Permissions Configuration
# Role/Action/Category matrix. Single source of truth for authorization.
# Loaded by core/config and enforced by domain/services/permission_policy.py
#
# Four roles, exactly one per user. Six categories. No wildcards, no defaults.

# Roles defined in the system
roles:
  - id: "executive_leadership"
    name: "Executive Leadership"
    description: "CEO, CFO, VP of Finance: read access and decision approval"
  - id: "corporate_finance_planners"
    name: "Corporate Finance & Planners"
    description: "Ask questions, upload/update documents"
  - id: "audit_compliance"
    name: "Audit & Compliance"
    description: "Read-only access to all categories, including audit trail"
  - id: "system_admin"
    name: "System Admin"
    description: "Manage users and settings; no access to financial content"

# Categories of data/actions
categories:
  - id: "invoice"
    name: "Invoice"
    description: "Invoices"
    sensitivity: "high"
  - id: "bank_statement"
    name: "Bank Statement"
    description: "Bank statements"
    sensitivity: "high"
  - id: "financial_statement"
    name: "Financial Statement"
    description: "Income statement, balance sheet, cash flow"
    sensitivity: "high"
  - id: "budget"
    name: "Budget"
    description: "Budgets and forecasts"
    sensitivity: "high"
  - id: "contract"
    name: "Contract"
    description: "Contracts"
    sensitivity: "high"
  - id: "board_report"
    name: "Board Report"
    description: "Board reports"
    sensitivity: "high"

# Permission matrix: role -> {category: [actions], role_actions: [actions]}
permissions:
  executive_leadership:
    categories:
      invoice: ["read"]
      bank_statement: ["read"]
      financial_statement: ["read"]
      budget: ["read"]
      contract: ["read"]
      board_report: ["read"]
    role_actions: ["approve"]
  corporate_finance_planners:
    categories:
      invoice: ["read", "upload", "update", "delete"]
      bank_statement: ["read", "upload", "update", "delete"]
      financial_statement: ["read", "upload", "update", "delete"]
      budget: ["read", "upload", "update", "delete"]
      contract: ["read", "upload", "update", "delete"]
      board_report: ["read", "upload", "update", "delete"]
    role_actions: []
  audit_compliance:
    categories:
      invoice: ["read"]
      bank_statement: ["read"]
      financial_statement: ["read"]
      budget: ["read"]
      contract: ["read"]
      board_report: ["read"]
    role_actions: ["view_audit_log"]
  system_admin:
    categories: {}
    role_actions: ["manage_users", "manage_settings", "view_audit_log"]
