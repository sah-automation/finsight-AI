# Permissions Configuration
# STATUS: planned. No runtime code reads this file yet; tracked in issue #11.
# It is exercised by tests/security/test_permissions.py.
# Role/Action/Category matrix. Intended single source of truth for authorization.
# It will be loaded by core/config and enforced by a domain policy service.
#
# The four role IDs match the config switch guide (5.29), the known-risks
# review (risk 24), the `users.role` migration check, and ADR-0003.

# Roles defined in the system
roles:
  - id: "executive_leadership"
    name: "Executive Leadership"
    description: "CEO, CFO, VP of Finance: read access and decision approval"
  - id: "corporate_finance_planners"
    name: "Corporate Finance & Planners"
    description: "Ask questions, upload documents, create forecasts and metrics"
  - id: "audit_compliance"
    name: "Audit & Compliance"
    description: "Read-only access to every category, including the audit trail"
  - id: "system_admin"
    name: "System Admin"
    description: "Manage users and settings; no access to financial content"

# Categories of data/actions
categories:
  - id: "financials"
    name: "Financial Statements"
    description: "Income statement, balance sheet, cash flow"
    sensitivity: "high"
  - id: "metrics"
    name: "Financial Metrics"
    description: "Ratios, KPIs, calculated metrics"
    sensitivity: "medium"
  - id: "forecasts"
    name: "Forecasts & Projections"
    description: "Future-looking estimates"
    sensitivity: "high"
  - id: "risks"
    name: "Risk Alerts"
    description: "Anomaly detection, threshold breaches"
    sensitivity: "high"
  - id: "decisions"
    name: "Decisions & Recommendations"
    description: "AI-generated recommendations, approval workflows"
    sensitivity: "high"
  - id: "documents"
    name: "Source Documents"
    description: "Uploaded PDFs, spreadsheets, raw data"
    sensitivity: "high"
  - id: "audit"
    name: "Audit Trail"
    description: "Question history, data lineage, changes"
    sensitivity: "medium"

# Actions that can be performed
actions:
  - id: "read"
    name: "Read"
    description: "View data and answers"
  - id: "write"
    name: "Write"
    description: "Create/update data"
  - id: "delete"
    name: "Delete"
    description: "Remove data"
  - id: "approve"
    name: "Approve"
    description: "Approve recommendations/decisions"
  - id: "upload"
    name: "Upload"
    description: "Upload new documents"
  - id: "configure"
    name: "Configure"
    description: "Change system settings"

# Permission matrix: role -> category -> allowed actions.
# Every category is listed for every role so that a denied category is explicit.
# `delete` is intentionally not granted to any pilot role; it stays ungranted
# until a retention policy exists.
# System Admin uses `configure` on content categories because there is no
# separate settings category. It never gets `read` on financial content.
permissions:
  executive_leadership:
    financials: ["read"]
    metrics: ["read"]
    forecasts: ["read"]
    risks: ["read"]
    decisions: ["read", "approve"]
    documents: ["read"]
    audit: []

  corporate_finance_planners:
    financials: ["read"]
    metrics: ["read", "write"]
    forecasts: ["read", "write"]
    risks: ["read", "write"]
    decisions: ["read", "write"]
    documents: ["read", "upload"]
    audit: []

  audit_compliance:
    financials: ["read"]
    metrics: ["read"]
    forecasts: ["read"]
    risks: ["read"]
    decisions: ["read"]
    documents: ["read"]
    audit: ["read"]

  system_admin:
    financials: ["configure"]
    metrics: ["configure"]
    forecasts: ["configure"]
    risks: ["configure"]
    decisions: ["configure"]
    documents: ["configure"]
    audit: ["read"]

# Company-level overrides (optional, for specific tenant customization)
# company_overrides:
#   "company-uuid-here":
#     corporate_finance_planners:
#       forecasts: ["read"]  # restrict forecast writes for this company

# There is no default fallback. A role with no entry is denied.
