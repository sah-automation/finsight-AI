# Development Environment Configuration
# Values here override schema.yaml defaults.

app:
  environment: "development"

switches:
  parallel_steps: true
  backup_request_enabled: true
  prompt_cache_enabled: true
  answer_cache_enabled: true
  vector_store: "neon_pgvector"
  detailed_tracing_enabled: true
  usage_metering_enabled: true
  llm_content_capture_enabled: true

models:
  region: "us-east-1"

llm:
  primary_model:
    provider: "litellm"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 3
    retry_base_delay_seconds: 1.0
  fallback_models:
    - provider: "litellm"
      max_tokens: 4096
      temperature: 0.0
      timeout_seconds: 20
      max_retries: 2
      retry_base_delay_seconds: 1.0
  embedding_model:
    provider: "litellm"
    dimensions: 1024
    batch_size: 10
    timeout_seconds: 30
    max_retries: 3

vector_store:
  host: "localhost"
  port: 5432
  database: "finsight_dev"
  username: "dev"
  password: "dev"  # pragma: allowlist secret
  ssl_mode: "disable"
  pool_size: 5
  max_overflow: 2
  pool_timeout_seconds: 30
  pool_recycle_seconds: 3600
  hnsw_ef_search: 50
  hnsw_ef_construction: 100
  hnsw_m: 8

readers:
  textract:
    async_enabled: false
    region: "us-east-1"

storage:
  region: "us-east-1"
  documents_bucket: "finsight-dev-documents"
  reports_bucket: "finsight-dev-reports"
  backups_bucket: "finsight-dev-backups"

auth:
  region: "us-east-1"
  user_pool_id: "us-east-1-dev"
  client_id: "dev-client"

metering:
  table_name: "finsight-dev-metering"

observability:
  log_level: "DEBUG"
  trace_sample_rate: 1.0
  # Dev traces flow through the local redacting OTel collector
  # (docker-compose.test.yml, OTLP HTTP on 4318), which deletes blocklisted
  # span attributes and exports to Arize Phoenix (UI: http://localhost:6006).
  # Do not point this straight at Phoenix - that would bypass redaction.
  otlp_endpoint: "http://localhost:4318/v1/traces"
  alerts:
    fallback_model_3_used: true
    reranker_down: true
    embedding_retries_exceeded: 3
    job_in_retry_list: true
    role_cache_stale_seconds: 7200

caches:
  answer_cache:
    table_name: "${ANSWER_CACHE_TABLE}"
    ttl_seconds: 86400
    key_prefix: "ans:"
    max_entry_size_bytes: 400000
  role_cache:
    table_name: "${ROLE_CACHE_TABLE}"
    ttl_seconds: 3600
    key_prefix: "role:"
    max_entry_size_bytes: 400000
    refresh_ahead_seconds: 300

queue:
  ingestion_queue_url: "${INGESTION_QUEUE_URL}"
  reprocessing_queue_url: "${REPROCESSING_QUEUE_URL}"
  reports_queue_url: "${REPORTS_QUEUE_URL}"
  dead_letter_queue_url: "${DLQ_URL}"
  visibility_timeout_seconds: 300
  max_receive_count: 3
  batch_size: 10
  wait_time_seconds: 20

reranker:
  provider: "cohere"
  top_n: 20
  timeout_seconds: 10
  max_retries: 2
  batch_size: 50

encryption:
  key_mode: aws_managed
  kms_key_alias: ""

# Phase 2 sections
charts:
  specs:
    revenue_trend:
      chart_id: revenue_trend
      chart_type: trend_line
      kpi_codes: [revenue]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: higher_is_better
    margin_trend:
      chart_id: margin_trend
      chart_type: trend_line
      kpi_codes: [gross_margin, net_margin]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: higher_is_better
    cash_flow_comparison:
      chart_id: cash_flow_comparison
      chart_type: comparison_bar
      kpi_codes: [cash_flow]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: higher_is_better
    expense_comparison:
      chart_id: expense_comparison
      chart_type: comparison_bar
      kpi_codes: [operating_expenses]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: lower_is_better
    burn_comparison:
      chart_id: burn_comparison
      chart_type: comparison_bar
      kpi_codes: [burn_rate]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: lower_is_better
    runway_comparison:
      chart_id: runway_comparison
      chart_type: comparison_bar
      kpi_codes: [runway]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: higher_is_better
    collection_periods:
      chart_id: collection_periods
      chart_type: comparison_bar
      kpi_codes: [dso, dpo]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: lower_is_better
    budget_variance:
      chart_id: budget_variance
      chart_type: comparison_bar
      kpi_codes: [budget_vs_actual]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: true
      polarity: neutral
    revenue_breakdown:
      chart_id: revenue_breakdown
      chart_type: breakdown_bar
      kpi_codes: [revenue]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: [document_category]
      diverging: false
      polarity: higher_is_better
  export_formats: [png, pdf]

dashboard:
  auto_refresh_seconds: 30
  default_layout:
    kpi_codes: [revenue, gross_margin, net_margin, operating_expenses, cash_flow, burn_rate]
    charts:
      - {chart_id: revenue_trend, span: full}
      - {chart_id: margin_trend, span: half}
  staleness_badge_enabled: true

web:
  vercel:
    sync_enabled: true
    preview_api_target: mock
    log_forwarding_enabled: true
    log_retention_days: 30
    never_log_file: config/never_log.yaml
    otlp_log_group: /aws/finsight/web-prod

golden_set:
  kpi_questions_path: tests/golden/questions/phase2_kpi.yaml
