# Development Environment Configuration
# Values here override schema.yaml defaults.

app:
  environment: "development"

switches:
  parallel_steps: true
  backup_request_enabled: true
  prompt_cache_enabled: true
  answer_cache_enabled: true
  detailed_tracing_enabled: true
  usage_metering_enabled: true
  llm_content_capture_enabled: true

models:
  region: "us-east-1"

llm:
  primary_model:
    provider: "litellm"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 3
    retry_base_delay_seconds: 1.0
  fallback_models:
    - provider: "litellm"
      max_tokens: 4096
      temperature: 0.0
      timeout_seconds: 20
      max_retries: 2
      retry_base_delay_seconds: 1.0
  embedding_model:
    provider: "litellm"
    dimensions: 1024
    batch_size: 10
    timeout_seconds: 30
    max_retries: 3

vector_store:
  host: "localhost"
  port: 5432
  database: "finsight_dev"
  username: "dev"
  password: "dev"  # pragma: allowlist secret
  ssl_mode: "disable"
  pool_size: 5
  max_overflow: 2
  pool_timeout_seconds: 30
  pool_recycle_seconds: 3600
  hnsw_ef_search: 50
  hnsw_ef_construction: 100
  hnsw_m: 8

readers:
  textract:
    async_enabled: false
    region: "us-east-1"

storage:
  region: "us-east-1"
  documents_bucket: "finsight-dev-documents"
  reports_bucket: "finsight-dev-reports"
  backups_bucket: "finsight-dev-backups"

auth:
  region: "us-east-1"
  user_pool_id: "us-east-1-dev"
  client_id: "dev-client"

metering:
  table_name: "finsight-dev-metering"

observability:
  log_level: "DEBUG"
  trace_sample_rate: 1.0
  otlp_endpoint: ""
  alerts:
    fallback_model_3_used: true
    reranker_down: true
    embedding_retries_exceeded: 3
    job_in_retry_list: true
    role_cache_stale_seconds: 7200

caches:
  answer_cache:
    table_name: "${ANSWER_CACHE_TABLE}"
    ttl_seconds: 86400
    key_prefix: "ans:"
    max_entry_size_bytes: 400000
  role_cache:
    table_name: "${ROLE_CACHE_TABLE}"
    ttl_seconds: 3600
    key_prefix: "role:"
    max_entry_size_bytes: 400000
    refresh_ahead_seconds: 300

queue:
  ingestion_queue_url: "${INGESTION_QUEUE_URL}"
  reprocessing_queue_url: "${REPROCESSING_QUEUE_URL}"
  reports_queue_url: "${REPORTS_QUEUE_URL}"
  dead_letter_queue_url: "${DLQ_URL}"
  visibility_timeout_seconds: 300
  max_receive_count: 3
  batch_size: 10
  wait_time_seconds: 20

reranker:
  provider: "cohere"
  top_n: 20
  timeout_seconds: 10
  max_retries: 2
  batch_size: 50

encryption:
  key_mode: aws_managed
  kms_key_alias: ""
