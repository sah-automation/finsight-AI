# Test Environment Configuration
# Used by the local docker-compose.test.yml stack and CI integration tests.
# Values must match docker-compose.test.yml and infra/localstack/init.sh.
# No real credentials belong in this file.

app:
  environment: "test"

switches:
  reranker_enabled: true
  backup_request_enabled: true
  parallel_retrieval_enabled: false  # keep the local test path simple
  per_sentence_citation_check: true
  async_textract_enabled: false  # LocalStack does not run Textract
  ocr_fallback_enabled: true
  answer_cache_enabled: true
  role_cache_enabled: true
  detailed_tracing_enabled: true
  usage_metering_enabled: false  # adapter not implemented yet

llm:
  primary_model:
    model_id: "anthropic/claude-3-5-haiku-20241022"
    max_tokens: 4096
    timeout_seconds: 30
  fallback_models:
    - provider: "litellm"
      model_id: "openai/gpt-4o-mini"
      max_tokens: 4096
      temperature: 0.0
      timeout_seconds: 20
      max_retries: 2
      retry_base_delay_seconds: 1.0
  embedding_model:
    model_id: "amazon/titan-embed-text-v2:0"
    batch_size: 50

vector_store:
  host: "localhost"
  port: 5432
  database: "test"
  username: "test"
  password: "test"  # pragma: allowlist secret
  ssl_mode: "disable"
  pool_size: 5
  max_overflow: 2

readers:
  textract:
    async_enabled: false
    region: "us-east-1"

reranker:
  provider: "local"  # Cohere is not available in CI

caches:
  answer_cache:
    table_name: "answer_cache"
    max_entry_size_bytes: 400000
  role_cache:
    table_name: "role_cache"
    max_entry_size_bytes: 400000

queue:
  ingestion_queue_url: "http://localhost:4566/000000000000/ingestion"
  reprocessing_queue_url: "http://localhost:4566/000000000000/reprocessing"
  reports_queue_url: "http://localhost:4566/000000000000/reports"
  dead_letter_queue_url: "http://localhost:4566/000000000000/dlq"

storage:
  documents_bucket: "documents"
  reports_bucket: "reports"
  backups_bucket: "backups"
  region: "us-east-1"

auth:
  user_pool_id: "us-east-1_testpool"
  client_id: "testclient"
  region: "us-east-1"

metering:
  table_name: "metering"

observability:
  log_level: "INFO"
  log_format: "json"
  trace_sample_rate: 1.0
  otlp_endpoint: "http://localhost:4317"
  alerts:
    fallback_model_3_used: false
    reranker_down: false
    embedding_retries_exceeded: 10
    job_in_retry_list: false
    role_cache_stale_seconds: 86400

security:
  require_company_id_on_all_queries: true
  pii_detection_enabled: false  # local test fixtures are not production data
  pii_action: "log"
  prompt_injection_detection_enabled: false
