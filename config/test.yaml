# Test Environment Configuration

app:
  environment: "test"

switches:
  parallel_steps: true
  backup_request_enabled: true
  prompt_cache_enabled: true
  answer_cache_enabled: true
  detailed_tracing_enabled: true
  usage_metering_enabled: true
  llm_content_capture_enabled: true

models:
  region: "us-east-1"
  answer:
    primary: "groq/openai/gpt-oss-120b"
    primary_fallbacks:
      - "gemini/gemini-3.6-flash"
      - "nvidia_nim/google/gemma-4-31b-it"
      - "self_hosted/open_model_small"
    cheap: "groq/openai/gpt-oss-20b"
    cheap_fallbacks:
      - "gemini/gemini-3.1-flash-lite"
      - "groq/openai/gpt-oss-120b"
      - "self_hosted/open_model_small"
  rerank:
    primary: "cohere/rerank-english-v3.0"
  approved_models:
    - model_id: "gemini/gemini-3.6-flash"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "gemini/gemini-3.5-flash-lite"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "gemini/gemini-3.1-flash-lite"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "groq/openai/gpt-oss-120b"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "groq/openai/gpt-oss-20b"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "groq/qwen/qwen3.8-27b"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "nvidia_nim/nvidia/nemotron-3.5-bolt-e4b"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "nvidia_nim/google/gemma-4-31b-it"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "gemini/gemini-3.8-flash"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "gemini/gemini-embedding-001"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "nvidia_nim/llama-3.2-nv-rerankqa-1b-v2"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "self_hosted/open_model_small"
      regions: ["us-east-1", "us-west-2", "us", "in-region"]
    - model_id: "self_hosted/cross_encoder_small"
      regions: ["us-east-1", "us-west-2", "us", "in-region"]
    - model_id: "cohere/rerank-english-v3.0"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "cohere/rerank-multilingual-v3.0"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "test/primary"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "test/fallback-1"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "test/fallback-2"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "test/embedding"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "cohere/test"
      regions: ["us-east-1", "us-west-2", "us"]

llm:
  primary_model:
    provider: "litellm"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 3
    retry_base_delay_seconds: 1.0
  fallback_models:
    - provider: "litellm"
      max_tokens: 4096
      temperature: 0.0
      timeout_seconds: 30
      max_retries: 2
      retry_base_delay_seconds: 1.0
  embedding_model:
    provider: "litellm"
    dimensions: 1024
    batch_size: 10
    timeout_seconds: 30
    max_retries: 3
  router:
    num_retries: 3
    retry_after: 60
    allowed_fails: 3
    cooldown_time: 300

vector_store:
  host: "localhost"
  port: 5432
  database: "test"
  username: "test"
  password: "test"  # pragma: allowlist secret
  ssl_mode: "disable"
  pool_size: 5
  max_overflow: 2
  pool_timeout_seconds: 30
  pool_recycle_seconds: 3600
  hnsw_ef_search: 50
  hnsw_ef_construction: 100
  hnsw_m: 8

readers:
  priority:
    - "pdfplumber"
    - "textract"
    - "tesseract"
    - "excel"
    - "csv"
    - "docx"
  textract:
    async_enabled: false
    poll_interval_seconds: 5
    max_poll_attempts: 10
    feature_types:
      - "TABLES"
      - "FORMS"
    region: "us-east-1"
  tesseract:
    languages: ["eng"]
    dpi: 300
    config: "--psm 6"
  chunking:
    strategy: "semantic"
    max_chunk_tokens: 512
    overlap_tokens: 50
    min_chunk_tokens: 50
    respect_boundaries: true

reranker:
  provider: "cohere"
  top_n: 10
  timeout_seconds: 10
  max_retries: 2
  batch_size: 50

caches:
  answer_cache:
    table_name: "test-answers"
    ttl_seconds: 86400
    key_prefix: "ans:"
    max_entry_size_bytes: 400000
  role_cache:
    table_name: "test-roles"
    ttl_seconds: 3600
    key_prefix: "role:"
    max_entry_size_bytes: 400000
    refresh_ahead_seconds: 300

queue:
  ingestion_queue_url: "http://localhost:4566/000000000000/ingest"
  reprocessing_queue_url: "http://localhost:4566/000000000000/reprocess"
  reports_queue_url: "http://localhost:4566/000000000000/reports"
  dead_letter_queue_url: "http://localhost:4566/000000000000/dlq"
  visibility_timeout_seconds: 300
  max_receive_count: 3
  batch_size: 10
  wait_time_seconds: 20

storage:
  documents_bucket: "test-docs"
  reports_bucket: "test-reports"
  backups_bucket: "test-backups"
  region: "us-east-1"
  presigned_url_expiry_seconds: 3600
  multipart_threshold_mb: 100
  multipart_chunksize_mb: 50

auth:
  user_pool_id: "test"
  client_id: "test"
  region: "us-east-1"
  jwks_cache_ttl_seconds: 3600
  token_verification_clock_skew_seconds: 60

metering:
  table_name: "test-metering"
  flush_interval_seconds: 60
  batch_size: 100

observability:
  log_level: "INFO"
  log_format: "json"
  trace_sample_rate: 1.0
  service_name: "finsight-ai"
  otlp_endpoint: "http://localhost:4318/v1/traces"
  otlp_headers: {}
  alerts:
    fallback_model_3_used: true
    reranker_down: true
    embedding_retries_exceeded: 3
    job_in_retry_list: true
    role_cache_stale_seconds: 7200

security:
  require_company_id_on_all_queries: true
  pii_detection_enabled: true
  pii_action: "mask"
  prompt_injection_detection_enabled: true
  max_question_length: 10000
  max_context_tokens: 100000

ingestion:
  max_document_size_mb: 100
  allowed_mime_types: ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "text/csv", "image/png", "image/jpeg", "image/tiff"]
  virus_scan_enabled: true
  page_router_enabled: true
  chunk_strategy: structure_recursive
  child_chunk_tokens: 500
  parent_mode: section
  max_parent_tokens: 1500
  llm_context_categories: []
  required_metadata: [company, period, category, currency, units, page, table_id]

documents:
  reader: pdfplumber
  scan_reader: tesseract
  table_reader: pdfplumber
  per_company_override: {}
  categories: ["invoice", "bank_statement", "financial_statement", "budget", "contract", "board_report"]
  upload_types: ["new", "update"]
  delta_tracking: true
  duplicate_check: true
  version_retention_days: 365
  deleted_retention_days: 30

retrieval:
  hybrid_search_enabled: true
  vector_weight: 0.7
  keyword_weight: 0.3
  top_k: 50
  rerank_top_n: 20
  rerank_parallel_batches: 2
  evidence_min_score: 0.30
  evidence_min_search_score: 0.50
  evidence_min_chunks: 1

question_flow:
  first_word_timeout_seconds: 2.0
  max_wait_seconds: 30
  evidence_threshold: 0.7

output_gate:
  per_sentence_citation_check: true
  number_check_enabled: true
  block_on_failure: true

consistency:
  check_interval_seconds: 300
  fresh_read_window_seconds: 10

answer_check:
  enabled: true

access:
  roles: ["executive_leadership", "corporate_finance_planners", "audit_compliance", "system_admin"]
  permissions_file: "config/permissions.yaml"
  role_cache_seconds_privileged: 0

encryption:
  key_mode: aws_managed
  kms_key_alias: ""
