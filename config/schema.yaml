# FinSight AI Configuration Schema
# Source of truth for all configuration. Validated at startup.
# Environment-specific files (dev.yaml, staging.yaml, prod.yaml) provide values.

# ============================================================
# Application Metadata
# ============================================================
app:
  name: "finsight-ai"
  version: "0.1.0"
  environment: "development"

# ============================================================
# Feature Switches (both paths must exist and be tested)
# ============================================================
switches:
  parallel_steps: true
  backup_request_enabled: true
  prompt_cache_enabled: true
  answer_cache_enabled: true


# ============================================================
# Models Configuration (approved & priced model policy)
# ============================================================
models:
  region: "us-east-1"
  answer:
    primary: "gemini-3.8-flash"
    primary_fallbacks:
      - "nvidia_nim/meta/llama-3.1-70b-instruct"
      - "groq/llama-3.3-70b-versatile"
      - "self_hosted/open_model_small"
    cheap: "groq/llama-3.1-8b-instant"
    cheap_fallbacks:
      - "nvidia_nim/meta/llama-3.1-8b-instruct"
      - "gemini-3.6-flash"
      - "self_hosted/open_model_small"
  failover_on:
    - "timeout"
    - "first_word_timeout"
    - "rate_limit"
    - "server_error"
    - "provider_unavailable"
  embedding:
    primary: "gemini-embedding-001"
    version: "v1"
    dimensions: 1024
    retry_attempts: 3
    retry_wait_seconds: 2
  rerank:
    primary: "cohere/rerank-english-v3.0"
    timeout_ms: 600
    on_failure: "search_order"
  timeout_seconds: 20
  first_token_timeout_seconds: 4.0
  backup_request_enabled: true
  backup_request_after_seconds: 2.5
  prompt_cache_enabled: true
  max_output_tokens: 1000
  monthly_budget_per_company: 50
  approved_models:
    - model_id: "gemini-3.8-flash"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "gemini-3.6-flash"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "gemini-embedding-001"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "groq/llama-3.3-70b-versatile"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "groq/llama-3.1-8b-instant"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "nvidia_nim/meta/llama-3.1-70b-instruct"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "nvidia_nim/meta/llama-3.1-8b-instruct"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "nvidia_nim/llama-3.2-nv-rerankqa-1b-v2"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "self_hosted/open_model_small"
      regions: ["us-east-1", "us-west-2", "us", "in-region"]
    - model_id: "self_hosted/cross_encoder_small"
      regions: ["us-east-1", "us-west-2", "us", "in-region"]
    - model_id: "cohere/rerank-english-v3.0"
      regions: ["us-east-1", "us-west-2", "us"]
    - model_id: "cohere/rerank-multilingual-v3.0"
      regions: ["us-east-1", "us-west-2", "us"]


# ============================================================
# LLM Configuration
# ============================================================
llm:
  primary_model:
    provider: "litellm"
    max_tokens: 8192
    temperature: 0.0
    timeout_seconds: 60
    max_retries: 3
    retry_base_delay_seconds: 1.0
  fallback_models:
    - provider: "litellm"
      max_tokens: 8192
      temperature: 0.0
      timeout_seconds: 30
      max_retries: 2
      retry_base_delay_seconds: 1.0
  embedding_model:
    provider: "litellm"
    dimensions: 1024
    batch_size: 100
    timeout_seconds: 30
    max_retries: 3
  router:
    num_retries: 3
    retry_after: 60
    allowed_fails: 3
    cooldown_time: 300

vector_store:
  host: "${VECTOR_DB_HOST}"
  port: 5432
  database: "${VECTOR_DB_NAME}"
  username: "${VECTOR_DB_USER}"
  password: "${VECTOR_DB_PASSWORD}"
  ssl_mode: "require"
  pool_size: 10
  max_overflow: 5
  pool_timeout_seconds: 30
  pool_recycle_seconds: 3600
  hnsw_ef_search: 100
  hnsw_ef_construction: 200
  hnsw_m: 16

# ============================================================
# Document Readers
# ============================================================
readers:
  priority:
    - "pdfplumber"
    - "textract"
    - "tesseract"
    - "excel"
    - "csv"
    - "docx"
  textract:
    async_enabled: true
    poll_interval_seconds: 5
    max_poll_attempts: 120
    feature_types:
      - "TABLES"
      - "FORMS"
    region: "${AWS_REGION}"
  tesseract:
    languages: ["eng"]
    dpi: 300
    config: "--psm 6"
  chunking:
    strategy: "semantic"
    max_chunk_tokens: 512
    overlap_tokens: 50
    min_chunk_tokens: 50
    respect_boundaries: true

# ============================================================
# Reranker
# ============================================================
reranker:
  provider: "cohere"
  top_n: 20
  timeout_seconds: 10
  max_retries: 2
  batch_size: 50

# ============================================================
# Caches (DynamoDB)
# ============================================================
caches:
  answer_cache:
    table_name: "${ANSWER_CACHE_TABLE}"
    ttl_seconds: 86400
    key_prefix: "ans:"
    max_entry_size_bytes: 400000
  role_cache:
    table_name: "${ROLE_CACHE_TABLE}"
    ttl_seconds: 3600
    key_prefix: "role:"
    max_entry_size_bytes: 400000
    refresh_ahead_seconds: 300

# ============================================================
# Queue (SQS)
# ============================================================
queue:
  ingestion_queue_url: "${INGESTION_QUEUE_URL}"
  reprocessing_queue_url: "${REPROCESSING_QUEUE_URL}"
  reports_queue_url: "${REPORTS_QUEUE_URL}"
  dead_letter_queue_url: "${DLQ_URL}"
  # Base AWS endpoint for LocalStack (e.g. http://localhost:4566).
  # When empty, the adapter derives it from the queue URL.
  endpoint_url: "${AWS_ENDPOINT_URL:-}"
  visibility_timeout_seconds: 300
  max_receive_count: 3
  batch_size: 10
  wait_time_seconds: 20

# ============================================================
# Storage (S3)
# ============================================================
storage:
  documents_bucket: "${DOCUMENTS_BUCKET}"
  reports_bucket: "${REPORTS_BUCKET}"
  backups_bucket: "${BACKUPS_BUCKET}"
  region: "${AWS_REGION}"
  presigned_url_expiry_seconds: 3600
  multipart_threshold_mb: 100
  multipart_chunksize_mb: 50

# ============================================================
# Authentication (Cognito)
# ============================================================
auth:
  user_pool_id: "${COGNITO_USER_POOL_ID}"
  client_id: "${COGNITO_CLIENT_ID}"
  region: "${AWS_REGION}"
  jwks_cache_ttl_seconds: 3600
  token_verification_clock_skew_seconds: 60

# ============================================================
# Metering & Pricing
# ============================================================
metering:
  table_name: "${METERING_TABLE}"
  flush_interval_seconds: 60
  batch_size: 100
  price_table: "config/prices.yaml"

# ============================================================
# Observability
# ============================================================
observability:
  log_level: "INFO"
  log_format: "json"
  trace_sample_rate: 1.0
  service_name: "finsight-ai"
  otlp_endpoint: "${OTLP_ENDPOINT}"
  otlp_headers: {}
  alerts:
    fallback_model_3_used: true
    reranker_down: true
    embedding_retries_exceeded: 3
    job_in_retry_list: true
    role_cache_stale_seconds: 7200

# ============================================================
# Security & Company Separation
# ============================================================
security:
  require_company_id_on_all_queries: true
  pii_detection_enabled: true
  pii_action: "mask"
  prompt_injection_detection_enabled: true
  max_question_length: 10000
  max_context_tokens: 100000

# ============================================================
# Phase 1
# ============================================================
ingestion:
  max_document_size_mb: 100
  allowed_mime_types: ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "text/csv", "image/png", "image/jpeg", "image/tiff"]
  virus_scan_enabled: true
  page_router_enabled: true
  chunk_strategy: structure_recursive
  child_chunk_tokens: 500
  parent_mode: section
  max_parent_tokens: 1500
  llm_context_categories: []
  required_metadata: [company, period, category, currency, units, page, table_id]

documents:
  reader: pdfplumber
  scan_reader: tesseract
  table_reader: pdfplumber
  per_company_override: {}
  categories: ["invoice", "bank_statement", "financial_statement", "budget", "contract", "board_report"]
  upload_types: ["new", "update"]
  delta_tracking: true
  duplicate_check: true
  version_retention_days: 365
  deleted_retention_days: 30
  source_original_link_ttl_seconds: 300
  source_viewer_signing_key: "${SOURCE_VIEWER_SIGNING_KEY}"
retrieval:
  hybrid_search_enabled: true
  vector_weight: 0.7
  keyword_weight: 0.3
  top_k: 50
  rerank_top_n: 20
  rerank_parallel_batches: 2
  evidence_min_score: 0.30
  evidence_min_search_score: 0.50
  evidence_min_chunks: 1

question_flow:
  first_word_timeout_seconds: 2.0
  max_wait_seconds: 30
  evidence_threshold: 0.7

output_gate:
  per_sentence_citation_check: true
  number_check_enabled: true
  block_on_failure: true

consistency:
  check_interval_seconds: 300
  fresh_read_window_seconds: 10

answer_check:
  enabled: true

access:
  roles: ["executive_leadership", "corporate_finance_planners", "audit_compliance", "system_admin"]
  permissions_file: "config/permissions.yaml"
  role_cache_seconds_privileged: 0
