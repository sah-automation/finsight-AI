# Staging Environment Configuration

app:
  environment: "staging"

switches:
  parallel_steps: true
  backup_request_enabled: true
  prompt_cache_enabled: true
  answer_cache_enabled: true

models:
  region: "us-east-1"

llm:
  primary_model:
    provider: "litellm"
    model_id: "gemini/gemini-1.5-pro"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 3
    retry_base_delay_seconds: 1.0
  fallback_models:
    - provider: "litellm"
      model_id: "nvidia_nim/meta/llama-3.1-70b-instruct"
      max_tokens: 4096
      temperature: 0.0
      timeout_seconds: 20
      max_retries: 2
      retry_base_delay_seconds: 1.0
  embedding_model:
    provider: "litellm"
    model_id: "gemini/text-embedding-004"
    dimensions: 1024
    batch_size: 10
    timeout_seconds: 30
    max_retries: 3

vector_store:
  host: "${VECTOR_DB_HOST}"
  port: 5432
  database: "${VECTOR_DB_NAME}"
  username: "${VECTOR_DB_USER}"
  password: "${VECTOR_DB_PASSWORD}"
  ssl_mode: "require"
  pool_size: 10
  max_overflow: 5
  pool_timeout_seconds: 30
  pool_recycle_seconds: 3600
  hnsw_ef_search: 100
  hnsw_ef_construction: 200
  hnsw_m: 16

storage:
  region: "${AWS_REGION}"
  documents_bucket: "${DOCUMENTS_BUCKET}"
  reports_bucket: "${REPORTS_BUCKET}"
  backups_bucket: "${BACKUPS_BUCKET}"

auth:
  region: "${AWS_REGION}"
  user_pool_id: "${COGNITO_USER_POOL_ID}"
  client_id: "${COGNITO_CLIENT_ID}"

metering:
  table_name: "${METERING_TABLE}"

observability:
  log_level: "INFO"
  trace_sample_rate: 0.5
  otlp_endpoint: "${OTLP_ENDPOINT}"
  alerts:
    fallback_model_3_used: true
    reranker_down: true
    embedding_retries_exceeded: 3
    job_in_retry_list: true
    role_cache_stale_seconds: 7200
