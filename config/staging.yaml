# Staging Environment Configuration

app:
  environment: "staging"

switches:
  parallel_steps: true
  backup_request_enabled: true
  prompt_cache_enabled: true
  answer_cache_enabled: true
  vector_store: "aurora_pgvector"
  detailed_tracing_enabled: true
  usage_metering_enabled: true
  llm_content_capture_enabled: false

models:
  region: "us-east-1"

llm:
  primary_model:
    provider: "litellm"
    max_tokens: 4096
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 3
    retry_base_delay_seconds: 1.0
  fallback_models:
    - provider: "litellm"
      max_tokens: 4096
      temperature: 0.0
      timeout_seconds: 20
      max_retries: 2
      retry_base_delay_seconds: 1.0
  embedding_model:
    provider: "litellm"
    dimensions: 1024
    batch_size: 10
    timeout_seconds: 30
    max_retries: 3

vector_store:
  host: "${VECTOR_DB_HOST}"
  port: 5432
  database: "${VECTOR_DB_NAME}"
  username: "${VECTOR_DB_USER}"
  password: "${VECTOR_DB_PASSWORD}"
  ssl_mode: "require"
  pool_size: 10
  max_overflow: 5
  pool_timeout_seconds: 30
  pool_recycle_seconds: 3600
  hnsw_ef_search: 100
  hnsw_ef_construction: 200
  hnsw_m: 16

storage:
  region: "${AWS_REGION}"
  documents_bucket: "${DOCUMENTS_BUCKET}"
  reports_bucket: "${REPORTS_BUCKET}"
  backups_bucket: "${BACKUPS_BUCKET}"

auth:
  region: "${AWS_REGION}"
  user_pool_id: "${COGNITO_USER_POOL_ID}"
  client_id: "${COGNITO_CLIENT_ID}"

metering:
  table_name: "${METERING_TABLE}"

observability:
  log_level: "INFO"
  trace_sample_rate: 0.5
  otlp_endpoint: "${OTLP_ENDPOINT}"
  otlp_headers: ${OTLP_HEADERS}
  alerts:
    fallback_model_3_used: true
    reranker_down: true
    embedding_retries_exceeded: 3
    job_in_retry_list: true
    role_cache_stale_seconds: 7200
    dashboard_latency_ms: 2000

encryption:
  key_mode: aws_managed
  kms_key_alias: ""

# Phase 2 sections
charts:
  specs:
    revenue_trend:
      chart_id: revenue_trend
      chart_type: trend_line
      kpi_codes: [revenue]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: higher_is_better
    margin_trend:
      chart_id: margin_trend
      chart_type: trend_line
      kpi_codes: [gross_margin, net_margin]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: higher_is_better
    cash_flow_comparison:
      chart_id: cash_flow_comparison
      chart_type: comparison_bar
      kpi_codes: [cash_flow]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: higher_is_better
    expense_comparison:
      chart_id: expense_comparison
      chart_type: comparison_bar
      kpi_codes: [operating_expenses]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: lower_is_better
    burn_comparison:
      chart_id: burn_comparison
      chart_type: comparison_bar
      kpi_codes: [burn_rate]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: lower_is_better
    runway_comparison:
      chart_id: runway_comparison
      chart_type: comparison_bar
      kpi_codes: [runway]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: higher_is_better
    collection_periods:
      chart_id: collection_periods
      chart_type: comparison_bar
      kpi_codes: [dso, dpo]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: false
      polarity: lower_is_better
    budget_variance:
      chart_id: budget_variance
      chart_type: comparison_bar
      kpi_codes: [budget_vs_actual]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: []
      diverging: true
      polarity: neutral
    revenue_breakdown:
      chart_id: revenue_breakdown
      chart_type: breakdown_bar
      kpi_codes: [revenue]
      supported_periods: [4, 6, 8]
      periods_selectable: [2, 3, 4]
      breakdown_keys: [document_category]
      diverging: false
      polarity: higher_is_better
  export_formats: [png, pdf]

dashboard:
  auto_refresh_seconds: 30
  default_layout:
    kpi_codes: [revenue, gross_margin, net_margin, operating_expenses, cash_flow, burn_rate]
    charts:
      - {chart_id: revenue_trend, span: full}
      - {chart_id: margin_trend, span: half}
  staleness_badge_enabled: true

web:
  vercel:
    sync_enabled: true
    preview_api_target: mock
    log_forwarding_enabled: true
    log_retention_days: 30
    never_log_file: config/never_log.yaml
    otlp_log_group: /aws/finsight/web-prod

golden_set:
  kpi_questions_path: tests/golden/questions/phase2_kpi.yaml
